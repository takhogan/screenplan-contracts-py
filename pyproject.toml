[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenplan-contracts"
version = "0.1.0"
description = "ScreenPlan shared Pydantic models, JSON schemas, and validation helpers (Script, ScriptAction, ScriptActionLog, queue entries)."
requires-python = ">=3.9"
license = { text = "ISC" }
dependencies = [
    "pydantic>=2.5",
    "jsonschema>=4.21",
    "screenplan-contracts-schemas @ git+https://github.com/takhogan/screenplan-contracts.git@main",
]

# Every subpackage, not only the top one: a plain `packages = [...]` list left
# screenplan_contracts._generated and screenplan_contracts.event_grammar out of
# a non-editable install (pip install git+…, which ScriptEngine and
# ScriptScheduler builds use), so `import screenplan_contracts` failed there.
[tool.setuptools.packages.find]
include = ["screenplan_contracts", "screenplan_contracts.*"]
